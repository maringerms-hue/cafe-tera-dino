<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Praxis-Assistent Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: test bar on top (role switch) · each role is its own full screen: practice website + chat (patient), inbox dashboard (MFA), approvals (doctor). Single light look on purpose: it mimics a real practice website. */
:root{
  --teal:#0E4A4C; --teal-2:#165E60; --mint:#E6F4EF; --mint-2:#D3EBE2; --mint-3:#F3FAF7;
  --paper:#FAF8F4; --white:#FFFFFF; --ink:#173033; --ink-2:#4F6466; --line:#D7E2DE;
  --coral:#E8604C; --red:#B8303A; --red-bg:#FCEDEE; --amber:#9A6200; --amber-bg:#FFF3DA;
  --ok:#1D7A4E; --ok-bg:#E3F4EA; --blue:#2C5A8C; --blue-bg:#E7EFF8;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --r-s:10px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- test bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--teal)}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--teal);color:var(--white)}
.tbar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:8px;max-width:1240px;margin:0 auto}
.tbar .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--coral);color:var(--white);border-radius:6px;padding:2px 8px}
.tbar .note{font-size:13px;opacity:.85}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;margin-left:auto}
.roles button{border:0;background:transparent;color:var(--white);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;position:relative}
.roles button[aria-current="true"]{background:var(--white);color:var(--teal)}
.roles .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--coral);color:var(--white);font-size:11px;line-height:18px;text-align:center}
.reset{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--white);border-radius:999px;padding:5px 12px;font-size:13px}
@media (max-width:640px){.tbar .note{display:none}.tbar .reset{margin-left:auto;padding:3px 10px;font-size:12px}.roles{order:3;margin-left:0;width:100%;justify-content:space-between}.roles button{flex:1;padding:6px 4px;font-size:12.5px}}

/* ---------- start ---------- */
.start{max-width:1040px;margin:0 auto;padding-block:48px 64px}
.start .lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;align-items:center}
.start h1{font-size:clamp(28px,4.2vw,44px);font-weight:700;color:var(--teal);letter-spacing:-.01em}
.start p.sub{font-size:17px;color:var(--ink-2);max-width:58ch;margin:14px 0 0}
.start img{max-width:100%;width:340px;justify-self:center}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left}
.rcard .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-2)}
.rcard h3{font-size:19px;color:var(--ink)}
.rcard p{margin:0;color:var(--ink-2);font-size:14px}
.rcard ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.rcard .go{margin-top:auto;align-self:flex-start;border:0;background:var(--teal);color:var(--white);font-weight:600;border-radius:var(--r-s);padding:10px 16px}
.hint{margin-top:28px;background:var(--mint);border-radius:var(--r);padding:16px 18px;font-size:14px;color:var(--ink);max-width:80ch}
@media (max-width:820px){.start .lead{grid-template-columns:1fr}.start img{width:220px;order:-1}.cards{grid-template-columns:1fr}}

/* ---------- practice website (patient) ---------- */
.site{background:var(--paper);min-height:calc(100% - 52px)}
.shead{background:var(--white);border-bottom:1px solid var(--line)}
.shead-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--teal)}
.logo .plus{width:26px;height:26px;border-radius:7px;background:var(--teal);color:var(--white);display:grid;place-items:center;font-size:18px;line-height:1}
.snav{display:flex;gap:18px;margin-left:auto;font-size:14px;color:var(--ink-2)}
.snav span{white-space:nowrap}
.btn{border:0;border-radius:var(--r-s);background:var(--teal);color:var(--white);font-weight:600;padding:10px 16px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
@media (max-width:760px){.snav{display:none}.shead .btn{margin-left:auto;padding:8px 12px;font-size:14px}}
.hero{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;padding-block:56px 40px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-2)}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:700;color:var(--teal);margin-top:10px;letter-spacing:-.015em}
.hero p{font-size:18px;color:var(--ink-2);margin:16px 0 26px;max-width:46ch}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{background:var(--mint);border-radius:28px;aspect-ratio:5/4;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.hero-art img{width:78%;max-width:100%}
.hero-art .speech{position:absolute;left:8%;top:9%;background:var(--white);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(14,74,76,.12)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:32px 24px}.hero-art{order:-1}}
.info{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:8px 96px}
.icard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.icard h3{font-size:16px;color:var(--teal);margin-bottom:8px}
.icard p,.icard dl{margin:0;font-size:14px;color:var(--ink-2)}
.icard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.icard dt{color:var(--ink)}
.icard dd{margin:0}
@media (max-width:760px){.info{grid-template-columns:1fr}}

/* launcher */
.launch{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:10px}
.launch .tip{background:var(--white);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(14,74,76,.16);max-width:220px}
.launch button.face{width:74px;height:74px;border-radius:50%;border:3px solid var(--white);padding:0;background:var(--mint-2);box-shadow:0 10px 26px rgba(14,74,76,.28);position:relative}
.launch button.face img{width:100%;height:100%;border-radius:50%;display:block}
.launch .dot{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:var(--white);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--white)}
@media (prefers-reduced-motion:no-preference){.launch button.face{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}

/* chat panel */
.chat{position:fixed;z-index:45;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 32px);height:min(680px,calc(100% - 100px));background:var(--white);border-radius:22px;box-shadow:0 20px 60px rgba(14,74,76,.28);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat header img{width:40px;height:40px;border-radius:50%}
.chat header .t{font-weight:700;font-size:15px}
.chat header .s{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:5px}
.chat header .s::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat header .x{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px;color:var(--ink-2)}
.log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--mint-3)}
.msg{max-width:86%;border-radius:16px;padding:10px 13px;font-size:15px;white-space:pre-line}
.msg.bot{background:var(--mint);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--teal);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px}
.msg .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.msg.team{background:var(--blue-bg);align-self:flex-start;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-2);font-size:12px;padding:2px}
.card{align-self:stretch;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.card.ok{border-color:#A9D8BE;background:var(--ok-bg)}
.card.warn{border-color:#F0B9BE;background:var(--red-bg)}
.card .h{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.card.ok .h{color:var(--ok)} .card.warn .h{color:var(--red)}
.card .big{font-size:17px;font-weight:700;color:var(--red)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.card dt{color:var(--ink-2)} .card dd{margin:0;font-weight:500}
.card .num{font-size:20px;font-weight:700;letter-spacing:.02em;user-select:all}
.chips{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.chips.wrap{flex-direction:row;flex-wrap:wrap}
.chip{border:1.5px solid var(--teal);background:var(--white);color:var(--teal);font-weight:600;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.chip:hover{background:var(--mint)}
.chip.sec{border-color:var(--line);color:var(--ink-2);font-weight:500}
.typing{align-self:flex-start;background:var(--mint);border-radius:16px;padding:12px 14px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--teal-2);opacity:.4}
@media (prefers-reduced-motion:no-preference){.typing i{animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes tp{30%{opacity:1;transform:translateY(-3px)}}}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--white)}
.compose input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--mint-3)}
.compose button{border:0;background:var(--teal);color:var(--white);border-radius:12px;padding:0 14px;font-weight:600}
.foot{font-size:11.5px;color:var(--ink-2);padding:0 14px 10px;background:var(--white);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot button{border:0;background:none;padding:0;color:var(--teal);font-weight:600;font-size:12px;text-decoration:underline}
@media (max-width:560px){.chat{inset:calc(52px + env(safe-area-inset-top,0px)) 0 0 0;right:0;bottom:0;width:100%;max-width:100%;height:auto;border-radius:18px 18px 0 0}}
@media (max-width:640px){.chat{top:calc(96px + env(safe-area-inset-top,0px))}.toast{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px))}}

/* ---------- dashboards ---------- */
.dash{max-width:1240px;margin:0 auto;padding-block:24px 64px}
.dhead{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{font-size:26px;color:var(--teal)}
.dhead .meta{color:var(--ink-2);font-size:14px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.kpi b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.8fr);gap:16px;align-items:start}
.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid .side{grid-column:1/-1}}
@media (max-width:720px){.grid,.grid.two{grid-template-columns:1fr}}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel > h2{font-size:14px;font-weight:700;letter-spacing:.03em;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel > h2 .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--mint);color:var(--teal)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;align-items:start;padding:12px 16px 12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--white);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.item:hover{background:var(--mint-3)}
.item[aria-selected="true"]{background:var(--mint)}
.item .bar{align-self:stretch;border-radius:0 3px 3px 0;background:transparent}
.item.u .bar{background:var(--coral)}
.item .t{font-weight:600;font-size:14px}
.item .d{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tm{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-neu{background:var(--amber-bg);color:var(--amber)} .p-frei{background:var(--blue-bg);color:var(--blue)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-no{background:var(--red-bg);color:var(--red)} .p-grey{background:var(--mint);color:var(--teal-2)}
.type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-2);margin-right:6px}
.empty{padding:28px 16px;color:var(--ink-2);font-size:14px;text-align:center}
.detail{padding:16px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:20px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.detail dt{color:var(--ink-2)} .detail dd{margin:0}
.quote{background:var(--mint-3);border-left:3px solid var(--teal-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{font-size:14px;padding:9px 14px}
.btn.ok{background:var(--ok)} .btn.no{background:var(--white);color:var(--red);border:1.5px solid var(--red)}
.detail textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical;background:var(--mint-3)}
.detail label{font-size:13px;font-weight:600;color:var(--ink-2)}
.hist{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.hist li::before{content:"· ";color:var(--teal-2);font-weight:700}
.appts{list-style:none;margin:0;padding:0}
.appts li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.appts .h{font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal)}
.appts .w{color:var(--ink-2);font-size:13px}
.appts .new{font-size:11px;font-weight:700;color:var(--coral);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.daylbl{padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--mint-3);border-bottom:1px solid var(--line)}
.alert{border-color:#F0B9BE}
.alert > h2{background:var(--red-bg);color:var(--red)}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100vw - 32px)}
</style>

<div class="tbar"><div class="tbar-in gut">
  <span class="tag">Prototyp</span>
  <span class="note">Praxis am Kurpark · fiktive Praxis · bitte keine echten Gesundheitsdaten eingeben</span>
  <nav class="roles" aria-label="Rolle wählen">
    <button data-go="patient">Patient:in</button>
    <button data-go="mfa">Empfang (MFA)<span class="cnt" id="cntMfa" hidden></span></button>
    <button data-go="arzt">Ärztin<span class="cnt" id="cntArzt" hidden></span></button>
  </nav>
  <button class="reset" id="resetBtn" title="Alle Eingaben löschen und mit Beispieldaten neu beginnen">Neu starten</button>
</div></div>

<main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div>

const KEY='praxis-proto-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowLabel=()=>{const d=new Date();return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})};

    ],

      {id:'R2',type:'Frage',who:'Jonas K.',born:'02.11.1990',time:'08:47',text:'Brauche ich für die Grippeimpfung einen Termin oder kann ich vorbeikommen?',status:'neu',ex:true,hist:['08:47 per Chat eingegangen']},

    ],

  };
}
let S;
function load(){try{const v=localStorage.getItem(KEY);S=v?JSON.parse(v):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});

/* ---------- routing ---------- */
const ROUTES=['start','patient','mfa','arzt'];
let route=ROUTES.includes(location.hash.slice(1))?location.hash.slice(1):'start';
function go(r){route=r;if(location.hash.slice(1)!==r)location.hash=r;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(ROUTES.includes(r)&&r!==route){route=r;render()}});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
let resetArm=false;
$('#resetBtn').addEventListener('click',e=>{
  if(!resetArm){resetArm=true;e.target.textContent='Wirklich neu starten?';setTimeout(()=>{resetArm=false;e.target.textContent='Neu starten'},3500);return}
  resetArm=false;e.target.textContent='Neu starten';S=seed();save();toast('Alles zurückgesetzt – Beispieldaten geladen.');go('start')});

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- helpers ---------- */
const STATUS={neu:['Neu','p-neu'],freigabe:['Bei Ärztin','p-frei'],freigegeben:['Freigegeben','p-ok'],abgelehnt:['Rückfrage','p-no'],beantwortet:['Beantwortet','p-ok'],erledigt:['Erledigt','p-grey'],termin:['Info','p-grey']};
const PSTATUS={neu:'Eingegangen – das Praxisteam schaut es sich an',freigabe:'In Prüfung bei der Ärztin',freigegeben:'Freigegeben',abgelehnt:'Rückfrage der Praxis',beantwortet:'Beantwortet',erledigt:'Erledigt',termin:'Erledigt'};
function pill(s){const[a,c]=STATUS[s]||[s,'p-grey'];return `<span class="pill ${c}">${a}</span>`}
function newReq(o){S.seq++;const r=Object.assign({id:'R'+S.seq,time:nowLabel(),who:S.patientName||'Testperson',born:'—',status:'neu',hist:[nowLabel()+' per Chat eingegangen'],mine:true},o);S.reqs.unshift(r);return r}
function counts(){return{mfa:S.reqs.filter(r=>r.status==='neu').length,arzt:S.reqs.filter(r=>r.status==='freigabe').length}}

/* ---------- chat engine ---------- */
function push(m){S.chat.push(m);save()}
let typingT=null,pendingBot=null;
function bot(items,delay){ // items: array of message objects, shown with typing indicator
  const list=Array.isArray(items)?items:[items];
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const d=reduced?0:(delay??650);
  if(!d){list.forEach(push);renderChat();return}
  if(pendingBot){clearTimeout(typingT);pendingBot.forEach(push);pendingBot=null}
  pendingBot=list;showTyping(false);renderChat();showTyping(true);
  typingT=setTimeout(()=>{showTyping(false);const l=pendingBot||[];pendingBot=null;l.forEach(push);renderChat()},d);
}
function user(text){push({who:'user',text});renderChat()}
function showTyping(on){const log=$('#log');if(!log)return;let t=$('#typing');if(on&&!t){t=document.createElement('div');t.id='typing';t.className='typing';t.innerHTML='<i></i><i></i><i></i>';t.setAttribute('aria-label','Assistent schreibt');log.appendChild(t);log.scrollTop=log.scrollHeight}if(!on&&t)t.remove()}
const MENU=[['termin_neu','Termin vereinbaren'],['termin_versch','Termin verschieben'],['rezept','Rezept bestellen'],['ueberw','Überweisung anfragen'],['frage','Frage an das Praxisteam'],['zeiten','Öffnungszeiten & Anfahrt']];
function menu(text){return [{who:'bot',text:text||'Wobei kann ich Ihnen noch helfen?'},{who:'chips',opts:MENU.map(([k,l])=>({k,l})).concat(myReqs().length?[{k:'meine',l:'Meine Anfragen ansehen',sec:true}]:[])}]}
function myReqs(){return S.reqs.filter(r=>r.mine)}
function startChat(){
  if(S.started)return;S.started=true;
  push({who:'bot',text:'Guten Tag! Ich bin der digitale Assistent der Praxis am Kurpark. Wobei kann ich Ihnen helfen?',face:'happy'});
  push({who:'chips',opts:MENU.map(([k,l])=>({k,l}))});
  push({who:'card',cls:'',html:'<span style="color:var(--ink-2)">Ich stelle keine Diagnosen. Bei Notfällen rufen Sie bitte die <b>112</b>.</span>'});
  save();
}
const EMERG=/brust|herz.*(schmerz|stech|druck|rasen)|atemnot|keine luft|kaum luft|schlecht luft|ersticke|bewusstlos|ohnm[aä]cht|schlaganfall|gel[aä]hmt|l[aä]hmung|sprache.*(weg|verwaschen)|starke blutung|blutet stark|krampfanfall|vergiftung|notfall|suizid|umbringen|nicht mehr leben/i;
function emergency(text){
  S.alerts.unshift({time:nowLabel(),who:S.patientName||'Testperson',text:'„'+text.slice(0,90)+'" – Assistent hat auf 112 hingewiesen.'});
  S.flow=null;
  const suic=/suizid|umbringen|nicht mehr leben/i.test(text);
  bot([{who:'card',cls:'warn',html:`<div class="h">⚠ Möglicher Notfall</div><div class="big">Bitte rufen Sie sofort die 112.</div><div style="margin-top:4px">Ich kann Sie dazu leider nicht beraten. Bleiben Sie nicht allein, wenn es Ihnen schlecht geht.</div><dl><dt>Notruf</dt><dd class="num">112</dd><dt>Ärztl. Bereitschaftsdienst</dt><dd class="num">116 117</dd>${suic?'<dt>Telefonseelsorge</dt><dd class="num">0800 111 0 111</dd>':''}</dl>`,face:'serious'},
    {who:'chips',opts:[{k:'menu',l:'Es ist kein Notfall – zurück zum Menü',sec:true}]}],400);
}
function route_text(t){
  const s=t.toLowerCase();
  if(EMERG.test(s))return emergency(t);
  if(/verschieb|verleg|absag|anderen termin|umbuch/.test(s))return act('termin_versch');
  if(/termin|vorsorge|check|impf|blutabnahme/.test(s))return act('termin_neu');
  if(/rezept|medikament|tablette|verordn|e-rezept/.test(s))return act('rezept');
  if(/überweis|ueberweis|facharzt|orthop|kardio|derma|augen/.test(s))return act('ueberw');
  if(/öffnungs|oeffnungs|offen|geöffnet|wann.*(auf|offen)|adresse|anfahrt|parken|wo ist/.test(s))return act('zeiten');
  if(/^(hallo|hi|guten (tag|morgen|abend)|servus|moin)/.test(s))return bot(menu('Hallo! Schön, dass Sie da sind. Wobei kann ich helfen?'));
  if(/danke/.test(s))return bot(menu('Gern geschehen! Kann ich sonst noch etwas für Sie tun?'));
  // unknown -> offer handover
  S.flow={name:'handover',text:t};
  bot([{who:'bot',text:'Das kann ich leider nicht sicher beantworten. Soll ich Ihre Nachricht an das Praxisteam weitergeben? Sie bekommen die Antwort hier im Chat.'},{who:'chips',opts:[{k:'handover_yes',l:'Ja, bitte weitergeben'},{k:'menu',l:'Nein, zurück zum Menü',sec:true}]}]);
}
function onSend(text){
  text=text.trim();if(!text)return;
  user(text);
  const f=S.flow;
  if(EMERG.test(text))return emergency(text);
  if(f&&f.expect){ const fn=f.expect; f.expect=null; return TEXT[fn](text) }
  route_text(text);
}
function needName(next){
  if(S.patientName)return next();
  S.flow=Object.assign(S.flow||{},{expect:'name',after:next.name||''});
  pendingAfterName=next;
  bot({who:'bot',text:'Damit das Praxisteam Sie zuordnen kann: Wie heißen Sie? (Im Test reicht ein ausgedachter Name.)'});
}
let pendingAfterName=null;
const TEXT={
  name(t){S.patientName=t.split(/\s+/).slice(0,3).join(' ');save();const n=pendingAfterName;pendingAfterName=null;bot({who:'bot',text:'Danke, '+S.patientName.split(' ')[0]+'!'},350);setTimeout(()=>n&&n(),500)},
  medOther(t){S.flow.med=t;askDelivery()},
  ueReason(t){S.flow.reason=t;needName(sendUeberw)},
  frage(t){S.flow.text=t;needName(sendFrage)},
  reply(t){route_text(t)}
};
function chips(opts,wrap){return {who:'chips',opts,wrap}}
function act(k,label){
  if(label)user(label);
  switch(k){
    case 'menu': S.flow=null; return bot(menu());
    case 'termin_neu': S.flow={name:'neu'}; return bot([{who:'bot',text:'Gern! Worum geht es bei Ihrem Termin?'},chips([{k:'tn:Vorsorge / Check-up',l:'Vorsorge / Check-up'},{k:'tn:Akute Beschwerden',l:'Akute Beschwerden'},{k:'tn:Impfung',l:'Impfung'},{k:'tn:Blutabnahme',l:'Blutabnahme'},{k:'tn:Befundbesprechung',l:'Befund besprechen'}],true)]);
    case 'termin_versch': S.flow={name:'versch'};
      if(!S.appt) return bot(menu('Ich sehe aktuell keinen Termin von Ihnen. Möchten Sie einen neuen vereinbaren?'));
      return bot([{who:'bot',text:`Ich sehe Ihren Termin: ${S.appt.day}, ${S.appt.time} Uhr bei ${S.appt.doc}. Diese Zeiten sind noch frei:`},chips([{k:'tv:Mo., 9. Nov.|11:00',l:'Mo., 9. Nov. · 11:00 Uhr'},{k:'tv:Di., 10. Nov.|14:00',l:'Di., 10. Nov. · 14:00 Uhr'},{k:'tv:Mi., 11. Nov.|08:30',l:'Mi., 11. Nov. · 08:30 Uhr'},{k:'rueckruf',l:'Keiner passt – bitte zurückrufen',sec:true}])]);
    case 'rezept': S.flow={name:'rezept'}; return bot([{who:'bot',text:'Welches Medikament brauchen Sie? Das sind Ihre Dauermedikamente:'},chips([{k:'med:Ramipril 5 mg',l:'Ramipril 5 mg'},{k:'med:L-Thyroxin 75 µg',l:'L-Thyroxin 75 µg'},{k:'med:Metformin 500 mg',l:'Metformin 500 mg'},{k:'medOther',l:'Anderes Medikament',sec:true}])]);
    case 'medOther': S.flow.expect='medOther'; return bot({who:'bot',text:'Wie heißt das Medikament? Schreiben Sie es einfach in das Feld unten.'});
    case 'ueberw': S.flow={name:'ueberw'}; return bot([{who:'bot',text:'Zu welcher Fachrichtung möchten Sie überwiesen werden?'},chips([{k:'ue:Orthopädie',l:'Orthopädie'},{k:'ue:Kardiologie',l:'Kardiologie'},{k:'ue:Dermatologie',l:'Dermatologie'},{k:'ue:Augenheilkunde',l:'Augenheilkunde'},{k:'ue:Andere Fachrichtung',l:'Andere'}],true)]);
    case 'frage': S.flow={name:'frage',expect:'frage'}; return bot({who:'bot',text:'Schreiben Sie Ihre Frage unten in das Feld. Ich gebe sie an das Praxisteam weiter.'});
    case 'zeiten': S.flow=null; return bot([{who:'card',html:'<div class="h" style="color:var(--teal)">Praxis am Kurpark</div><dl><dt>Mo, Di, Do</dt><dd>08:00–12:00 · 15:00–18:00</dd><dt>Mi, Fr</dt><dd>08:00–13:00</dd><dt>Adresse</dt><dd>Am Kurpark 8, 65189 Wiesbaden</dd><dt>Telefon</dt><dd class="num" style="font-size:15px">0611 123 456</dd></dl><div style="margin-top:6px;color:var(--ink-2)">Parkplätze im Hof, Eingang barrierefrei.</div>'},...menu('Kann ich sonst noch etwas für Sie tun?')]);
    case 'rueckruf': return needName(()=>{const r=newReq({type:'Rückruf',text:'Kein passender Termin – bitte um Rückruf zur Terminfindung.'+(S.flow&&S.flow.reason?' Anlass: '+S.flow.reason:'')});save();S.flow=null;bot([{who:'card',cls:'ok',html:'<div class="h">An den Empfang übergeben</div>Das Praxisteam ruft Sie zurück, meist innerhalb von 2 Stunden.'},...menu()])});
    case 'handover_yes': return needName(()=>{const t=S.flow.text;newReq({type:'Frage',text:t});save();S.flow=null;bot([{who:'card',cls:'ok',html:'<div class="h">✓ An das Praxisteam übergeben</div>Antwort meist innerhalb von 2 Stunden – hier im Chat.'},...menu()])});
    case 'meine': return showMine();
    case 'apptOk': return confirmAppt();
  }
  if(k.startsWith('tn:')){S.flow.reason=k.slice(3);return bot([{who:'bot',text:'Diese Termine sind frei:'},chips([{k:'ts:Mo., 9. Nov.|08:15',l:'Mo., 9. Nov. · 08:15 Uhr'},{k:'ts:Mo., 9. Nov.|16:40',l:'Mo., 9. Nov. · 16:40 Uhr'},{k:'ts:Di., 10. Nov.|10:20',l:'Di., 10. Nov. · 10:20 Uhr'},{k:'rueckruf',l:'Keiner passt – bitte zurückrufen',sec:true}])])}
  if(k.startsWith('ts:')){const[d,t]=k.slice(3).split('|');S.flow.day=d;S.flow.time=t;return needName(()=>bot([{who:'bot',text:`Soll ich den Termin am ${d} um ${t} Uhr für Sie buchen?`},chips([{k:'apptOk',l:'Ja, Termin buchen'},{k:'termin_neu',l:'Andere Zeit wählen',sec:true}])]))}
  if(k.startsWith('tv:')){const[d,t]=k.slice(3).split('|');const old=S.appt.day+', '+S.appt.time;S.appt.day=d;S.appt.time=t;
    S.appts=S.appts.filter(a=>!a.mine);S.appts.push({day:d,time:t,who:S.patientName||'Sie (Testperson)',what:S.appt.reason+' · '+S.appt.doc,mine:true,isNew:true});
    newReq({type:'Termin',text:`Termin verschoben von ${old} auf ${d}, ${t} Uhr (automatisch gebucht).`,status:'termin',hist:[nowLabel()+' per Chat automatisch verschoben']});save();S.flow=null;
    return bot([{who:'card',cls:'ok',html:`<div class="h">✓ Geschafft!</div>Ihr neuer Termin ist bestätigt:<dl><dt>Wann</dt><dd>${d}, ${t} Uhr</dd><dt>Bei</dt><dd>${S.appt.doc}</dd></dl><div style="margin-top:6px;color:var(--ink-2)">Der alte Termin wurde freigegeben.</div>`,face:'happy'},...menu()])}
  if(k.startsWith('med:')){S.flow.med=k.slice(4);return askDelivery()}
  if(k.startsWith('del:')){S.flow.del=k.slice(4);return needName(sendRezept)}
  if(k.startsWith('ue:')){S.flow.fach=k.slice(3);S.flow.expect='ueReason';return bot({who:'bot',text:'Worum geht es, in wenigen Worten? Zum Beispiel: „Knieschmerzen seit drei Wochen".'})}
}
function askDelivery(){return bot([{who:'bot',text:`${S.flow.med} – wie möchten Sie das Rezept bekommen?`},chips([{k:'del:E-Rezept auf Gesundheitskarte',l:'E-Rezept auf meine Karte'},{k:'del:Abholung am Empfang',l:'Am Empfang abholen'}])])}
function sendRezept(){const f=S.flow;newReq({type:'Rezept',text:f.med,detail:f.del});S.flow=null;save();
  bot([{who:'card',cls:'ok',html:`<div class="h">✓ Rezeptanfrage gesendet</div>${esc(f.med)} · ${esc(f.del)}<div style="margin-top:6px;color:var(--ink-2)">Die Ärztin prüft die Anfrage. Ich sage Ihnen hier Bescheid, sobald es fertig ist.</div>`},...menu()])}
function sendUeberw(){const f=S.flow;newReq({type:'Überweisung',text:f.fach+': '+f.reason});S.flow=null;save();
  bot([{who:'card',cls:'ok',html:`<div class="h">✓ Überweisung angefragt</div>${esc(f.fach)}<div style="margin-top:6px;color:var(--ink-2)">Die Ärztin entscheidet, ob eine Überweisung nötig ist. Sie bekommen hier Bescheid.</div>`},...menu()])}
function sendFrage(){const f=S.flow;newReq({type:'Frage',text:f.text});S.flow=null;save();
  bot([{who:'card',cls:'ok',html:'<div class="h">✓ An den Empfang übergeben</div>Antwort meist innerhalb von 2 Stunden – hier im Chat.'},...menu()])}
function confirmAppt(){const f=S.flow;S.appts.push({day:f.day,time:f.time,who:S.patientName||'Testperson',what:f.reason,mine:true,isNew:true});
  newReq({type:'Termin',text:`Neuer Termin gebucht: ${f.day}, ${f.time} Uhr · ${f.reason}`,status:'termin',hist:[nowLabel()+' per Chat automatisch gebucht']});
  S.flow=null;save();
  bot([{who:'card',cls:'ok',html:`<div class="h">✓ Termin gebucht</div><dl><dt>Wann</dt><dd>${f.day}, ${f.time} Uhr</dd><dt>Anlass</dt><dd>${esc(f.reason)}</dd><dt>Bitte mitbringen</dt><dd>Gesundheitskarte</dd></dl>`,face:'happy'},...menu()])}
function showMine(){const m=myReqs();if(!m.length)return bot(menu('Sie haben noch keine Anfragen gestellt.'));
  bot([{who:'card',html:'<div class="h" style="color:var(--teal)">Ihre Anfragen</div>'+m.map(r=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><b>${esc(r.type)}</b> · ${esc(r.text.slice(0,60))}<br><span style="color:var(--ink-2)">${PSTATUS[r.status]}</span>${r.answer?`<div class="quote" style="margin-top:4px">${esc(r.answer)}</div>`:''}</div>`).join('')},...menu()])}
function notifyPatient(r,text){if(!r.mine)return;push({who:'team',text});S.unread++;save()}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===route?'true':'false'));
  const c=counts();
  const cm=$('#cntMfa'),ca=$('#cntArzt');cm.hidden=!c.mfa;cm.textContent=c.mfa;ca.hidden=!c.arzt;ca.textContent=c.arzt;
  const app=$('#app');
  if(route==='start')app.innerHTML=viewStart();
  if(route==='patient'){app.innerHTML=viewSite();bindSite()}
  if(route==='mfa'){app.innerHTML=viewMfa();bindDash('mfa')}
  if(route==='arzt'){app.innerHTML=viewArzt();bindDash('arzt')}
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
}
function viewStart(){return `<section class="start gut">
  <div class="lead"><div><div class="eyebrow">Testversion · Praxis am Kurpark</div>
  <h1>Testen Sie den digitalen Praxis-Assistenten</h1>
  <p class="sub">Ein Chat auf der Praxis-Website, der Termine bucht, Rezepte und Überweisungen annimmt und Fragen an das Team weitergibt. Probieren Sie ihn aus der Sicht von Patient:innen, Empfang und Ärztin aus – alle drei sehen dieselben Anfragen.</p></div>
  <img src="${IMG.wave}" alt="Das Maskottchen des Praxis-Assistenten winkt"></div>
  <div class="cards">
   <div class="rcard"><div class="who">Rolle 1</div><h3>Patient:in</h3><p>Sie sind auf der Website der Praxis und öffnen den Chat.</p><ul><li>Termin buchen oder verschieben</li><li>Rezept oder Überweisung anfragen</li><li>Eine Frage an das Team stellen</li></ul><button class="go" data-go="patient">Als Patient:in testen</button></div>
   <div class="rcard"><div class="who">Rolle 2</div><h3>Empfang (MFA)</h3><p>Hier landen alle Anfragen aus dem Chat.</p><ul><li>Fragen beantworten</li><li>Rezepte an die Ärztin weiterleiten</li><li>Neue und verschobene Termine sehen</li></ul><button class="go" data-go="mfa">Als MFA testen</button></div>
   <div class="rcard"><div class="who">Rolle 3</div><h3>Ärztin</h3><p>Nur das, was eine ärztliche Entscheidung braucht.</p><ul><li>Rezepte und Überweisungen freigeben</li><li>Hinweise auf mögliche Notfälle sehen</li></ul><button class="go" data-go="arzt">Als Ärztin testen</button></div>
  </div>
  <div class="hint"><b>So funktioniert der Test:</b> Wechseln Sie oben zwischen den Rollen. Eine Rezeptanfrage, die Sie als Patient:in senden, erscheint beim Empfang; nach der Freigabe durch die Ärztin bekommt die Patient:in im Chat Bescheid. Die Eingaben bleiben nur in diesem Browser. Mit „Neu starten" beginnen Sie von vorn. Einträge mit <span class="ex">Beispiel</span> sind vorbereitete Testdaten.</div>
 </section>`}
function viewSite(){return `<div class="site">
  <header class="shead"><div class="shead-in gut"><div class="logo"><span class="plus">+</span>Praxis am Kurpark</div>
   <nav class="snav" aria-label="Website (nur Attrappe)"><span>Praxis</span><span>Leistungen</span><span>Team</span><span>Kontakt</span></nav>
   <button class="btn" data-open>Termin vereinbaren</button></div></header>
  <section class="hero gut"><div><div class="eyebrow">Hausarztpraxis in Wiesbaden</div>
   <h1>Für Ihre Gesundheit.<br>Für Sie da.</h1>
   <p>Persönlich, aufmerksam und unkompliziert. Wir begleiten Sie in jeder Lebensphase.</p>
   <div class="row"><button class="btn" data-open>Termin vereinbaren →</button><button class="btn ghost" data-open>Rezept bestellen</button></div></div>
   <div class="hero-art"><span class="speech">Fragen? Ich helfe gern – rund um die Uhr.</span><img src="${IMG.point}" alt="Maskottchen des Praxis-Assistenten"></div>
  </section>
  <section class="info gut">
   <div class="icard"><h3>Sprechzeiten</h3><dl><dt>Mo, Di, Do</dt><dd>08:00–12:00 · 15:00–18:00</dd><dt>Mi, Fr</dt><dd>08:00–13:00</dd></dl></div>
   <div class="icard"><h3>So finden Sie uns</h3><p>Am Kurpark 8, 65189 Wiesbaden<br>Telefon 0611 123 456</p></div>
   <div class="icard"><h3>Im Notfall</h3><p>Notruf <b>112</b> · Ärztlicher Bereitschaftsdienst <b>116 117</b></p></div>
  </section>
  <div id="chatSlot"></div>
 </div>`}
function chatShell(){return `<section class="chat" role="dialog" aria-label="Chat mit dem Praxis-Assistenten">
  <header><img src="${IMG.neutral}" alt=""><div><div class="t">Praxis-Assistent</div><div class="s">online</div></div><button class="x" id="closeChat" aria-label="Chat schließen">×</button></header>
  <div class="log" id="log" aria-live="polite"></div>
  <form class="compose" id="compose"><label class="sr" for="msgIn">Nachricht</label><input id="msgIn" autocomplete="off" placeholder="Nachricht schreiben …"><button type="submit">Senden</button></form>
  <div class="foot"><span>Mit dem Praxisteam sprechen: 0611 123 456</span><button type="button" id="mineBtn">Meine Anfragen</button></div>
 </section>`}
function launcher(){return `<div class="launch">${S.started?'':'<span class="tip">Hallo! Klicken Sie auf mich, wenn Sie Hilfe brauchen.</span>'}<button class="face" data-open aria-label="Chat mit dem Praxis-Assistenten öffnen"><img src="${IMG.happy}" alt="">${S.unread?`<span class="dot">${S.unread}</span>`:''}</button></div>`}
function bindSite(){
  const slot=$('#chatSlot');
  const paint=()=>{slot.innerHTML=S.chatOpen?chatShell():launcher();
    slot.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',openChat));
    if(S.chatOpen){$('#closeChat').onclick=()=>{S.chatOpen=false;save();paint()};
      $('#compose').onsubmit=e=>{e.preventDefault();const i=$('#msgIn');const v=i.value;i.value='';onSend(v)};
      $('#mineBtn').onclick=()=>act('meine','Meine Anfragen');
      renderChat();setTimeout(()=>{const i=$('#msgIn');if(i&&matchMedia('(min-width:561px)').matches)i.focus()},50)}};
  $('#app').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',openChat));
  function openChat(){S.chatOpen=true;S.unread=0;startChat();save();paint()}
  paint();
}
function renderChat(){
  const log=$('#log');if(!log)return;
  const last=S.chat.length-1;
  log.innerHTML=S.chat.map((m,i)=>{
    if(m.who==='user')return `<div class="msg user">${esc(m.text)}</div>`;
    if(m.who==='bot')return `<div class="msg bot"><span class="lbl">Praxis-Assistent</span>${esc(m.text)}</div>`;
    if(m.who==='team')return `<div class="msg team"><span class="lbl">Praxisteam</span>${esc(m.text)}</div>`;
    if(m.who==='card')return `<div class="card ${m.cls||''}">${m.html}</div>`;
    if(m.who==='chips'){ if(i!==last && !isLastChips(i))return ''; return `<div class="chips ${m.wrap?'wrap':''}">${m.opts.map(o=>`<button class="chip ${o.sec?'sec':''}" data-k="${esc(o.k)}">${esc(o.l)}</button>`).join('')}</div>`}
    return '';
  }).join('');
  log.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{act(b.dataset.k,b.textContent)}));
  log.scrollTop=log.scrollHeight;
}
function isLastChips(i){for(let j=i+1;j<S.chat.length;j++){if(S.chat[j].who!=='card'&&S.chat[j].who!=='bot')return false;if(S.chat[j].who==='bot')return false}return true}

/* ---------- MFA ---------- */
let sel={mfa:null,arzt:null},tab='offen';
function viewMfa(){
  const open=S.reqs.filter(r=>r.status==='neu'),wait=S.reqs.filter(r=>r.status==='freigabe'),done=S.reqs.filter(r=>!['neu','freigabe'].includes(r.status));
  const shown=tab==='offen'?open:tab==='arzt'?wait:done;
  if(!sel.mfa||!S.reqs.find(r=>r.id===sel.mfa))sel.mfa=(shown[0]||{}).id||null;
  const r=S.reqs.find(x=>x.id===sel.mfa);
  return `<section class="dash gut"><div class="dhead"><div><h1>Eingang aus dem Chat</h1><div class="meta">Empfang · Praxis am Kurpark · Donnerstag, 5. November</div></div>
   <div class="kpis"><span class="kpi">Offen <b>${open.length}</b></span><span class="kpi">Bei Ärztin <b>${wait.length}</b></span><span class="kpi">Notfall-Hinweise heute <b>${S.alerts.length}</b></span></div></div>
   <div class="grid">
    <div class="panel"><div class="tabs" role="toolbar" aria-label="Filter">
      <button data-tab="offen" aria-pressed="${tab==='offen'}">Zu bearbeiten (${open.length})</button>
      <button data-tab="arzt" aria-pressed="${tab==='arzt'}">Bei Ärztin (${wait.length})</button>
      <button data-tab="fertig" aria-pressed="${tab==='fertig'}">Erledigt (${done.length})</button></div>
      ${listHtml(shown,'mfa')}</div>
    <div class="panel">${r?detailMfa(r):'<div class="empty">Wählen Sie links eine Anfrage aus.</div>'}</div>
    <div class="side" style="display:flex;flex-direction:column;gap:16px;min-width:0">
      ${alertsHtml()}
      <div class="panel"><h2>Termine</h2>${apptsHtml()}</div>
    </div>
   </div></section>`}
function listHtml(arr,role){if(!arr.length)return '<div class="empty">Hier ist gerade nichts. Neue Anfragen aus dem Chat erscheinen automatisch.</div>';
  return '<div class="list" role="listbox" aria-label="Anfragen">'+arr.map(r=>`<button class="item ${r.urgent?'u':''}" role="option" data-sel="${r.id}" aria-selected="${sel[role]===r.id}"><span class="bar"></span><span style="min-width:0"><span class="t"><span class="type">${esc(r.type)}</span>${esc(r.who)}${r.ex?'<span class="ex">Beispiel</span>':''}${r.mine&&!r.ex?'<span class="ex" style="color:var(--coral);border-color:var(--coral)">Ihr Test</span>':''}</span><span class="d" style="display:block">${esc(r.text)}</span></span><span class="tm">${r.time}<br>${pill(r.status)}</span></button>`).join('')+'</div>'}
function detailMfa(r){
  let acts='';
  if(r.status==='neu'&&(r.type==='Rezept'||r.type==='Überweisung'))acts=`<div class="acts"><button class="btn" data-a="toArzt">An Ärztin zur Freigabe</button><button class="btn ghost" data-a="ask">Rückfrage an Patient:in</button></div><div><label for="msgArea">Nachricht für die Rückfrage (optional)</label><textarea id="msgArea" placeholder="z. B. Bitte bringen Sie Ihren Medikationsplan mit."></textarea></div>`;
  else if(r.status==='neu')acts=`<div><label for="msgArea">Antwort an ${esc(r.who)}</label><textarea id="msgArea">${r.type==='Rückruf'?'Wir rufen Sie heute zwischen 11 und 12 Uhr an.':r.type==='Frage'&&r.ex?'Für die Grippeimpfung brauchen Sie keinen Termin. Kommen Sie gern Mo–Fr zwischen 8 und 11 Uhr vorbei.':''}</textarea></div><div class="acts"><button class="btn" data-a="answer">Antwort senden</button><button class="btn ghost" data-a="done">Ohne Antwort erledigen</button></div>`;
  else if(r.status==='freigabe')acts=`<div class="quote">Liegt bei Dr. L. Wagner zur Freigabe.</div>`;
  else if(r.status==='freigegeben'&&r.detail==='Abholung am Empfang')acts=`<div class="acts"><button class="btn" data-a="pickup">Abgeholt – erledigen</button></div>`;
  return `<div class="detail"><div><span class="type">${esc(r.type)}</span>${pill(r.status)}</div><h3>${esc(r.who)}</h3>
   <dl><dt>Eingang</dt><dd>${r.time} Uhr · Chat</dd><dt>Geb.-Datum</dt><dd>${esc(r.born)}</dd>${r.detail?`<dt>Weg</dt><dd>${esc(r.detail)}</dd>`:''}${r.last?`<dt>Historie</dt><dd>${esc(r.last)}</dd>`:''}</dl>
   <div class="quote">${esc(r.text)}</div>${r.answer?`<div><label>Antwort an Patient:in</label><div class="quote" style="border-color:var(--blue)">${esc(r.answer)}</div></div>`:''}
   ${acts}<div><label>Verlauf</label><ul class="hist">${r.hist.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div></div>`}
function alertsHtml(){return `<div class="panel alert"><h2>Mögliche Notfälle <span class="n">${S.alerts.length}</span></h2>${S.alerts.length?'<ul class="list">'+S.alerts.map(a=>`<li style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px"><b style="font-variant-numeric:tabular-nums">${a.time}</b> · ${esc(a.who)}${a.ex?'<span class="ex">Beispiel</span>':''}<br><span style="color:var(--ink-2)">${esc(a.text)}</span></li>`).join('')+'</ul>':'<div class="empty">Keine Hinweise.</div>'}</div>`}
function apptsHtml(){const days=[...new Set(S.appts.map(a=>a.day))];const ord=d=>({'Fr., 6. Nov.':1,'Mo., 9. Nov.':2,'Di., 10. Nov.':3,'Mi., 11. Nov.':4}[d]||9);days.sort((a,b)=>ord(a)-ord(b));
  return days.map(d=>`<div class="daylbl">${d}</div><ul class="appts">${S.appts.filter(a=>a.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<li><span class="h">${a.time}</span><span><b>${esc(a.who)}</b>${a.isNew?'<span class="new">neu per Chat</span>':''}<br><span class="w">${esc(a.what)}</span></span></li>`).join('')}</ul>`).join('')}
function viewArzt(){
  const wait=S.reqs.filter(r=>r.status==='freigabe');const done=S.reqs.filter(r=>['freigegeben','abgelehnt'].includes(r.status)&&(r.type==='Rezept'||r.type==='Überweisung'));
  if(!sel.arzt||!wait.find(r=>r.id===sel.arzt))sel.arzt=(wait[0]||{}).id||null;
  const r=S.reqs.find(x=>x.id===sel.arzt);
  return `<section class="dash gut"><div class="dhead"><div><h1>Zur Freigabe</h1><div class="meta">Dr. L. Wagner · nur Anfragen, die eine ärztliche Entscheidung brauchen</div></div>
   <div class="kpis"><span class="kpi">Warten <b>${wait.length}</b></span><span class="kpi">Heute entschieden <b>${done.length}</b></span></div></div>
   <div class="grid">
    <div class="panel"><h2>Wartet auf Freigabe <span class="n">${wait.length}</span></h2>${listHtml(wait,'arzt')}
      ${done.length?'<h2 style="border-top:1px solid var(--line)">Entschieden</h2>'+'<ul class="list">'+done.map(d=>`<li style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px"><span><span class="type">${esc(d.type)}</span>${esc(d.who)} · ${esc(d.text.slice(0,40))}</span>${pill(d.status)}</li>`).join('')+'</ul>':''}</div>
    <div class="panel">${r?detailArzt(r):'<div class="empty">Alles erledigt. Neue Rezepte und Überweisungen leitet der Empfang hierher weiter.</div>'}</div>
    <div class="side" style="min-width:0">${alertsHtml()}</div>
   </div></section>`}
function detailArzt(r){return `<div class="detail"><div><span class="type">${esc(r.type)}</span>${pill(r.status)}</div><h3>${esc(r.who)}</h3>
  <dl><dt>Geb.-Datum</dt><dd>${esc(r.born)}</dd><dt>Eingang</dt><dd>${r.time} Uhr · Chat</dd>${r.detail?`<dt>Weg</dt><dd>${esc(r.detail)}</dd>`:''}${r.last?`<dt>Historie</dt><dd>${esc(r.last)}</dd>`:''}</dl>
  <div class="quote">${esc(r.text)}</div>
  <div><label for="msgArea">Notiz an den Empfang (optional)</label><textarea id="msgArea" placeholder="z. B. Bitte Termin zur Blutkontrolle in 4 Wochen vereinbaren."></textarea></div>
  <div class="acts"><button class="btn ok" data-a="approve">Freigeben</button><button class="btn no" data-a="reject">Nicht freigeben – Rückfrage</button></div>
  <div><label>Verlauf</label><ul class="hist">${r.hist.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div></div>`}
function bindDash(role){
  const app=$('#app');
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sel.mfa=null;render()});
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{sel[role]=b.dataset.sel;render()});
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(role,b.dataset.a));
}
function doAct(role,a){
  const r=S.reqs.find(x=>x.id===sel[role]);if(!r)return;
  const note=(($('#msgArea')||{}).value||'').trim();const t=nowLabel();
  if(a==='toArzt'){r.status='freigabe';r.hist.push(t+' MFA: an Ärztin weitergeleitet');toast('An die Ärztin weitergeleitet.')}
  if(a==='ask'){r.status='abgelehnt';const m=note||'Bitte rufen Sie uns kurz an: 0611 123 456.';r.answer=m;r.hist.push(t+' MFA: Rückfrage gesendet');notifyPatient(r,`Rückfrage zu Ihrer Anfrage (${r.type}): ${m}`);toast('Rückfrage an die Patient:in gesendet.')}
  if(a==='answer'){if(!note){toast('Bitte zuerst eine Antwort schreiben.');return}r.status='beantwortet';r.answer=note;r.hist.push(t+' MFA: beantwortet');notifyPatient(r,note);toast('Antwort gesendet – erscheint im Chat der Patient:in.')}
  if(a==='done'){r.status='erledigt';r.hist.push(t+' MFA: erledigt');toast('Erledigt.')}
  if(a==='pickup'){r.status='erledigt';r.hist.push(t+' MFA: abgeholt');toast('Als abgeholt markiert.')}
  if(a==='approve'){r.status='freigegeben';r.hist.push(t+' Ärztin: freigegeben'+(note?' – '+note:''));
    const msg=r.type==='Rezept'?(r.detail==='Abholung am Empfang'?`Ihr Rezept für ${r.text} ist fertig und liegt am Empfang bereit.`:`Ihr E-Rezept für ${r.text} ist freigegeben. Sie können es mit Ihrer Gesundheitskarte in jeder Apotheke einlösen.`):`Ihre Überweisung (${r.text.split(':')[0]}) ist freigegeben. Sie können sie am Empfang abholen.`;
    r.answer=msg;notifyPatient(r,msg);toast('Freigegeben – die Patient:in bekommt Bescheid.')}
  if(a==='reject'){r.status='abgelehnt';const m=note||'Die Ärztin möchte das kurz mit Ihnen besprechen. Bitte vereinbaren Sie einen Termin.';r.answer=m;r.hist.push(t+' Ärztin: Rückfrage');notifyPatient(r,m);toast('Rückfrage an die Patient:in gesendet.')}
  save();render();
}
render();
})();
</script>

</body>
</html>
