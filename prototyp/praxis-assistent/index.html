<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Praxis-Assistent Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: test bar on top (role switch) · each role is its own full screen: practice website + chat (patient), inbox dashboard (MFA), approvals (doctor). Single light look on purpose: it mimics a real practice website. */
:root{
  --teal:#0E4A4C; --teal-2:#165E60; --mint:#E6F4EF; --mint-2:#D3EBE2; --mint-3:#F3FAF7;
  --paper:#FAF8F4; --white:#FFFFFF; --ink:#173033; --ink-2:#4F6466; --line:#D7E2DE;
  --coral:#E8604C; --red:#B8303A; --red-bg:#FCEDEE; --amber:#9A6200; --amber-bg:#FFF3DA;
  --ok:#1D7A4E; --ok-bg:#E3F4EA; --blue:#2C5A8C; --blue-bg:#E7EFF8;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --r-s:10px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- test bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--teal)}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--teal);color:var(--white)}
.tbar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:8px;max-width:1240px;margin:0 auto}
.tbar .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--coral);color:var(--white);border-radius:6px;padding:2px 8px}
.tbar .note{font-size:13px;opacity:.85}
.roles{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;margin-left:auto}
.roles button{border:0;background:transparent;color:var(--white);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;position:relative}
.roles button[aria-current="true"]{background:var(--white);color:var(--teal)}
.roles .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--coral);color:var(--white);font-size:11px;line-height:18px;text-align:center}
.reset{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--white);border-radius:999px;padding:5px 12px;font-size:13px}
@media (max-width:640px){.tbar .note{display:none}.tbar .reset{margin-left:auto;padding:3px 10px;font-size:12px}.roles{order:3;margin-left:0;width:100%;justify-content:space-between}.roles button{flex:1;padding:6px 4px;font-size:12.5px}}

/* ---------- start ---------- */
.start{max-width:1040px;margin:0 auto;padding-block:48px 64px}
.start .lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;align-items:center}
.start h1{font-size:clamp(28px,4.2vw,44px);font-weight:700;color:var(--teal);letter-spacing:-.01em}
.start p.sub{font-size:17px;color:var(--ink-2);max-width:58ch;margin:14px 0 0}
.start img{max-width:100%;width:340px;justify-self:center}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left}
.rcard .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-2)}
.rcard h3{font-size:19px;color:var(--ink)}
.rcard p{margin:0;color:var(--ink-2);font-size:14px}
.rcard ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.rcard .go{margin-top:auto;align-self:flex-start;border:0;background:var(--teal);color:var(--white);font-weight:600;border-radius:var(--r-s);padding:10px 16px}
.hint{margin-top:28px;background:var(--mint);border-radius:var(--r);padding:16px 18px;font-size:14px;color:var(--ink);max-width:80ch}
@media (max-width:820px){.start .lead{grid-template-columns:1fr}.start img{width:220px;order:-1}.cards{grid-template-columns:1fr}}

/* ---------- practice website (patient) ---------- */
.site{background:var(--paper);min-height:calc(100% - 52px)}
.shead{background:var(--white);border-bottom:1px solid var(--line)}
.shead-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--teal)}
.logo .plus{width:26px;height:26px;border-radius:7px;background:var(--teal);color:var(--white);display:grid;place-items:center;font-size:18px;line-height:1}
.snav{display:flex;gap:18px;margin-left:auto;font-size:14px;color:var(--ink-2)}
.snav span{white-space:nowrap}
.btn{border:0;border-radius:var(--r-s);background:var(--teal);color:var(--white);font-weight:600;padding:10px 16px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
@media (max-width:760px){.snav{display:none}.shead .btn{margin-left:auto;padding:8px 12px;font-size:14px}}
.hero{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;padding-block:56px 40px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-2)}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:700;color:var(--teal);margin-top:10px;letter-spacing:-.015em}
.hero p{font-size:18px;color:var(--ink-2);margin:16px 0 26px;max-width:46ch}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{background:var(--mint);border-radius:28px;aspect-ratio:5/4;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.hero-art img{width:78%;max-width:100%}
.hero-art .speech{position:absolute;left:8%;top:9%;background:var(--white);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(14,74,76,.12)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:32px 24px}.hero-art{order:-1}}
.info{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:8px 96px}
.icard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.icard h3{font-size:16px;color:var(--teal);margin-bottom:8px}
.icard p,.icard dl{margin:0;font-size:14px;color:var(--ink-2)}
.icard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.icard dt{color:var(--ink)}
.icard dd{margin:0}
@media (max-width:760px){.info{grid-template-columns:1fr}}

/* launcher */
.launch{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:10px}
.launch .tip{background:var(--white);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(14,74,76,.16);max-width:220px}
.launch button.face{width:74px;height:74px;border-radius:50%;border:3px solid var(--white);padding:0;background:var(--mint-2);box-shadow:0 10px 26px rgba(14,74,76,.28);position:relative}
.launch button.face img{width:100%;height:100%;border-radius:50%;display:block}
.launch .dot{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:var(--white);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--white)}
@media (prefers-reduced-motion:no-preference){.launch button.face{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}

/* chat panel */
.chat{position:fixed;z-index:45;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 32px);height:min(680px,calc(100% - 100px));background:var(--white);border-radius:22px;box-shadow:0 20px 60px rgba(14,74,76,.28);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat header img{width:40px;height:40px;border-radius:50%}
.chat header .t{font-weight:700;font-size:15px}
.chat header .s{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:5px}
.chat header .s::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat header .x{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;width:40px;height:40px;border-radius:10px;color:var(--ink-2)}
.log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--mint-3)}
.msg{max-width:86%;border-radius:16px;padding:10px 13px;font-size:15px;white-space:pre-line}
.msg.bot{background:var(--mint);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--teal);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px}
.msg .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.msg.team{background:var(--blue-bg);align-self:flex-start;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-2);font-size:12px;padding:2px}
.card{align-self:stretch;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.card.ok{border-color:#A9D8BE;background:var(--ok-bg)}
.card.warn{border-color:#F0B9BE;background:var(--red-bg)}
.card .h{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.card.ok .h{color:var(--ok)} .card.warn .h{color:var(--red)}
.card .big{font-size:17px;font-weight:700;color:var(--red)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.card dt{color:var(--ink-2)} .card dd{margin:0;font-weight:500}
.card .num{font-size:20px;font-weight:700;letter-spacing:.02em;user-select:all}
.chips{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.chips.wrap{flex-direction:row;flex-wrap:wrap}
.chip{border:1.5px solid var(--teal);background:var(--white);color:var(--teal);font-weight:600;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.chip:hover{background:var(--mint)}
.chip.sec{border-color:var(--line);color:var(--ink-2);font-weight:500}
.typing{align-self:flex-start;background:var(--mint);border-radius:16px;padding:12px 14px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--teal-2);opacity:.4}
@media (prefers-reduced-motion:no-preference){.typing i{animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes tp{30%{opacity:1;transform:translateY(-3px)}}}
.conf{font-size:20px;font-weight:700;color:var(--teal);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.card .note{margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.card .chip{display:block;width:100%;margin-top:10px}
.chat{position:fixed}
.sheet{position:absolute;inset:0;background:var(--white);display:flex;flex-direction:column;z-index:3}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:17px;color:var(--teal)}
.sh-head .x{margin-left:auto;border:0;background:transparent;font-size:24px;width:40px;height:40px;border-radius:10px;color:var(--ink-2)}
.sh-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sh-body h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.ap{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ap .when{font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ap .what{font-size:14px;color:var(--ink-2)}
.ap .pill{align-self:flex-start}
.muted{margin:0;color:var(--ink-2);font-size:14px}
.sh-foot{padding:10px 14px;border-top:1px solid var(--line)}
.sh-foot .btn{width:100%;justify-content:center}

.p-wait{background:#EFE9FB;color:#5B3C99}
.chipwrap{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.navrow{display:flex;gap:16px;justify-content:flex-start;padding:2px 2px 0}
.lnk{border:0;background:none;padding:4px 0;color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--teal)}
.btn.sm{font-size:13px;padding:7px 11px}
.btn.danger{color:var(--red);border-color:var(--red)}
.ap.cancelled{opacity:.7}.ap.cancelled .when{text-decoration:line-through;text-decoration-thickness:1px}
.ap .acts{margin-top:4px}
.confirm{border:1.5px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.callbox{border:1.5px solid var(--teal);border-radius:12px;padding:12px 14px;background:var(--mint-3)}
.callnum{font-size:20px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;user-select:all}
.callmeta{font-size:13px;color:var(--ink-2)}
.detail dd.tel{font-weight:700;color:var(--teal);user-select:all}
.preview{display:flex;flex-direction:column;gap:6px}
.msg.inprev{max-width:100%;align-self:stretch;font-size:14px;white-space:normal}
.decision{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--mint-3)}
.decision dl{margin-top:6px}
.empty.big-empty{font-size:16px;font-weight:600;color:var(--teal);padding:48px 16px}
.empty.big-empty span{display:block;font-size:13px;font-weight:400;color:var(--ink-2);margin-top:6px}
.ex.test{color:var(--coral);border-color:var(--coral)}
.ex.back{color:var(--ok);border-color:#A9D8BE;background:var(--ok-bg)}
.nav-i.off{opacity:1;color:#8A9A9B;cursor:default}
.nav-i.off span{display:flex;flex-direction:column;line-height:1.2}
.nav-i.off small{font-size:11px;font-weight:500;color:#8A9A9B}
.appts li.cx .h,.appts li.cx b{text-decoration:line-through;color:var(--ink-2)}
.quote.reply{border-color:var(--ok);background:var(--ok-bg)}
.foot{align-items:center}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--white)}
.compose input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--mint-3)}
.compose button{border:0;background:var(--teal);color:var(--white);border-radius:12px;padding:0 14px;font-weight:600}
.foot{font-size:11.5px;color:var(--ink-2);padding:0 14px 10px;background:var(--white);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot button{border:0;background:none;padding:0;color:var(--teal);font-weight:600;font-size:12px;text-decoration:underline}
@media (max-width:560px){.chat{inset:calc(52px + env(safe-area-inset-top,0px)) 0 0 0;right:0;bottom:0;width:100%;max-width:100%;height:auto;border-radius:18px 18px 0 0}}
@media (max-width:640px){.chat{top:calc(96px + env(safe-area-inset-top,0px))}.toast{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px))}}

/* ---------- dashboards ---------- */
.dash{max-width:1240px;margin:0 auto;padding-block:24px 64px}
.appshell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 52px);background:var(--paper)}
.appshell .dash{max-width:1200px;margin:0;width:100%}
.side-nav{background:var(--white);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px);box-sizing:border-box}
.side-nav .brand{display:flex;gap:10px;align-items:flex-start;padding:0 8px 18px}
.side-nav .brand .plus{width:26px;height:26px;border-radius:7px;background:var(--teal);color:var(--white);display:grid;place-items:center;font-weight:700;flex:none}
.side-nav .brand b{display:block;font-size:14px;color:var(--teal)}
.side-nav .brand span{font-size:12px;color:var(--ink-2)}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.nav-i svg{flex:none}
.nav-i.on{background:var(--mint);color:var(--teal)}
.nav-i .b{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--teal);color:var(--white);font-size:11px;display:grid;place-items:center;padding:0 6px}
.nav-i.off{opacity:.55}
.side-nav .safe{margin-top:auto;background:var(--mint-3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--ink-2)}
.side-nav .safe b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.side-nav .me{display:flex;gap:10px;align-items:center;padding:12px 6px 0}
.side-nav .me .av{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--teal);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.side-nav .me b{display:block;font-size:13px}.side-nav .me span{font-size:12px;color:var(--ink-2)}
.greet{display:flex;align-items:center;gap:18px;background:var(--mint);border-radius:18px;padding:16px 20px;margin-bottom:18px}
.greet img{width:64px;height:64px;border-radius:50%;flex:none}
.greet h2{font-size:20px;color:var(--teal)}
.greet p{margin:2px 0 0;font-size:14px;color:var(--ink)}
@media (max-width:900px){.appshell{grid-template-columns:1fr}.side-nav{display:none}}
.dhead{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{font-size:26px;color:var(--teal)}
.dhead .meta{color:var(--ink-2);font-size:14px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.kpi b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.8fr);gap:16px;align-items:start}
.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid .side{grid-column:1/-1}}
@media (max-width:720px){.grid,.grid.two{grid-template-columns:1fr}}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel > h2{font-size:14px;font-weight:700;letter-spacing:.03em;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel > h2 .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--mint);color:var(--teal)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;align-items:start;padding:12px 16px 12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--white);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.item:hover{background:var(--mint-3)}
.item[aria-selected="true"]{background:var(--mint)}
.item .bar{align-self:stretch;border-radius:0 3px 3px 0;background:transparent}
.item.u .bar{background:var(--coral)}
.item .t{font-weight:600;font-size:14px}
.item .d{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tm{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-neu{background:var(--amber-bg);color:var(--amber)} .p-frei{background:var(--blue-bg);color:var(--blue)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-no{background:var(--red-bg);color:var(--red)} .p-grey{background:var(--mint);color:var(--teal-2)}
.type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-2);margin-right:6px}
.empty{padding:28px 16px;color:var(--ink-2);font-size:14px;text-align:center}
.detail{padding:16px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:20px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.detail dt{color:var(--ink-2)} .detail dd{margin:0}
.quote{background:var(--mint-3);border-left:3px solid var(--teal-2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{font-size:14px;padding:9px 14px}
.btn.ok{background:var(--ok)} .btn.no{background:var(--white);color:var(--red);border:1.5px solid var(--red)}
.detail textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical;background:var(--mint-3)}
.detail label{font-size:13px;font-weight:600;color:var(--ink-2)}
.hist{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.hist li::before{content:"· ";color:var(--teal-2);font-weight:700}
.appts{list-style:none;margin:0;padding:0}
.appts li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.appts .h{font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal)}
.appts .w{color:var(--ink-2);font-size:13px}
.appts .new{font-size:11px;font-weight:700;color:var(--coral);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.daylbl{padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--mint-3);border-bottom:1px solid var(--line)}
.alert{border-color:#F0B9BE}
.alert > h2{background:var(--red-bg);color:var(--red)}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
button.nav-i{background:none;border:0;width:100%;text-align:left;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
button.nav-i:hover{background:var(--mint-3)}
button.nav-i:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px;align-items:start}
.setp .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.setp label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.setp input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:var(--mint-3);color:var(--ink);width:100%}
.setp .sw{flex-direction:row;align-items:flex-start;gap:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;line-height:1.35}
.setp .sw input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--teal)}
.setp .sw.dis{color:var(--ink-2);cursor:default}
.setp .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setp .muted{margin:0;font-size:13px;color:var(--ink-2)}
.setacts{margin-top:16px}
.slotgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn.sm{font-size:13px;padding:7px 11px}
.pq{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pq:first-child{border-top:0}
.lnkbtn{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.daylbl{position:sticky;top:0;z-index:1}
.muted{color:var(--ink-2)}
.mviews{display:none;gap:6px;margin:0 0 14px}
.mviews button{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink-2)}
.mviews button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--teal)}
@media (max-width:900px){.mviews{display:flex}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100vw - 32px)}
</style>

  if(p==='tvp'){S.flow.data.apptId=v;return goStep('tv_slot')}
  if(p==='tv'){const[d,t]=v.split('|');Object.assign(S.flow.data,{day:d,time:t});return goStep('tv_confirm')}
  if(p==='abp'){S.flow.data.apptId=v;return goStep('ab_confirm')}
  if(p==='med'){S.flow.data.med=S.profile.meds[+v];S.flow.data.dauer=true;return goStep('rx_qty')}
  if(p==='qty'){S.flow.data.qty=v;return goStep('rx_del')}
  if(p==='del'){S.flow.data.del=v;return goStep('rx_sum')}
  if(p==='ue'){S.flow.data.fach=v;return goStep('ue_reason')}
  if(p==='rr'){const ctx=S.flow.data.ctx;S.flow=null;newReq({type:'Rückruf',text:'Bitte um Rückruf'+(ctx?` (${ctx})`:'')+' – kein passender Termin im Chat.',phone:S.profile.phone,reach:v,tries:0});save();
    return bot([{who:'card',cls:'ok',html:`<div class="h">✓ Rückruf angefragt</div>Wir rufen Sie ${esc(v)} unter ${S.profile.phone} an. ${WAIT}`},...followUp()])}
  if(p==='reply'){S.flow={name:'reply',data:{id:v},stack:['reply'],expect:'reply'};return bot([{who:'bot',text:'Schreiben Sie Ihre Antwort unten in das Feld.'},{who:'chips',opts:[],nav:true,back:false}])}
}
function confirmAppt(){const f=S.flow.data;S.seq++;S.appts.push({id:'A'+S.seq,day:f.day,time:f.time,who:S.profile.name,what:f.reason,mine:true,isNew:true,status:'ok'});
  newReq({type:'Termin',text:`Neuer Termin gebucht: ${f.day}, ${f.time} Uhr · ${f.reason}`,status:'termin',hist:[nowLabel()+' per Chat automatisch gebucht']});
  S.flow=null;save();
  bot([{who:'card',cls:'ok',html:`<div class="h">✓ Ihr Termin ist gebucht</div><div class="conf">${f.day} · ${f.time} Uhr</div><dl><dt>Anlass</dt><dd>${esc(f.reason)}</dd><dt>Bitte mitbringen</dt><dd>Gesundheitskarte</dd></dl><div class="note">Im echten Betrieb: Bestätigung per SMS oder E-Mail und Erinnerung einen Tag vorher.</div><button class="chip" data-k="meine">Meine Termine ansehen</button>`},...followUp()])}
function confirmVersch(){const d=S.flow.data,a=S.appts.find(x=>x.id===d.apptId);const old=`${a.day}, ${a.time}`;a.day=d.day;a.time=d.time;a.isNew=true;
  newReq({type:'Termin',text:`Termin verschoben von ${old} auf ${d.day}, ${d.time} Uhr · ${a.what}`,status:'termin',hist:[nowLabel()+' per Chat automatisch verschoben']});S.flow=null;save();
  bot([{who:'card',cls:'ok',html:`<div class="h">✓ Termin verschoben</div><div class="conf">${d.day} · ${d.time} Uhr</div><dl><dt>Anlass</dt><dd>${esc(a.what)}</dd><dt>Alter Termin</dt><dd>${old} Uhr – freigegeben</dd></dl><div class="note">Im echten Betrieb: Bestätigung per SMS oder E-Mail und Erinnerung einen Tag vorher.</div><button class="chip" data-k="meine">Meine Termine ansehen</button>`},...followUp()])}
function confirmAbsage(){const a=S.appts.find(x=>x.id===S.flow.data.apptId);a.status='abgesagt';a.cancelled=nowLabel();

function sendRezept(){const f=S.flow.data;const t=nowLabel();const txt=`${f.med.name}${f.med.dose?' '+f.med.dose:''} · ${f.qty}`;

function paintSheet(){const chat=$('.chat');if(!chat)return;let sh=$('#sheet');if(!sheetOpen){if(sh)sh.remove();return}

   <h3>Anfragen</h3>${rq.length?rq.map(r=>`<div class="ap"><div class="when">${esc(r.type)} <span class="pill ${(STATUS[r.status]||['','p-grey'])[1]}">${PSTATUS[r.status]}</span></div><div class="what">${esc(r.text)}</div>${r.answer?`<div class="quote">${esc(r.answer)}</div>`:''}${r.status==='wartet'?`<div class="acts"><button class="btn sm" data-sh="reply:${r.id}">Auf die Rückfrage antworten</button></div>`:''}</div>`).join(''):'<p class="muted">Noch keine Anfragen.</p>'}
   <p class="muted" style="font-size:12.5px">${WAIT}</p>
   </div><div class="sh-foot"><button class="btn" id="shBack">Zurück zum Chat</button></div>`;
  const close=()=>{sheetOpen=false;paintSheet()};
  $('#shClose').onclick=close;$('#shBack').onclick=close;
  sh.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const k=b.dataset.sh;close();
    if(k.startsWith('tvp:')){user('Termin verschieben');return startFlow('versch','tv_slot',{apptId:k.slice(4)})}
    if(k.startsWith('abp:')){user('Termin absagen');return startFlow('absage','ab_confirm',{apptId:k.slice(4)})}
    if(k.startsWith('reply:')){return act(k,'Auf die Rückfrage antworten')}
    act(k,b.textContent)});
}

}

const ALL_SLOTS=[['Fr., 6. Nov.','11:00'],['Fr., 6. Nov.','11:30'],...SLOTS_NEU,...SLOTS_V];
function freeSlots(){const taken=new Set(S.appts.filter(a=>a.status==='ok').map(a=>a.day+'|'+a.time));const seen=new Set();
  return ALL_SLOTS.filter(([d,t])=>{const k=d+'|'+t;if(taken.has(k)||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>ord(a[0])-ord(b[0])||a[1].localeCompare(b[1]))}
function apptPill(a){return a.status==='abgesagt'?'<span class="pill p-grey">Abgesagt</span>':'<span class="pill p-ok">Bestätigt</span>'}
function apptSrc(a){return a.mine?'Patienten-Chat':'Telefon / Empfang'}
function viewTermine(role){
  const days=[...new Set(S.appts.map(a=>a.day))].sort((a,b)=>ord(a)-ord(b));
  if(!sel.appt||!S.appts.find(a=>a.id===sel.appt))sel.appt=(S.appts.find(a=>a.mine&&a.status==='ok')||S.appts[0]||{}).id||null;
  const a=S.appts.find(x=>x.id===sel.appt);
  const list=days.map(d=>`<div class="daylbl">${d}</div>`+S.appts.filter(x=>x.day===d).sort((x,y)=>x.time.localeCompare(y.time)).map(x=>`<button class="item" data-appt="${x.id}" aria-selected="${sel.appt===x.id}"><span class="bar"></span><span style="min-width:0"><span class="t"><span class="type">${x.time}</span>${esc(x.who)}${x.mine?'<span class="ex test">Testprofil</span>':''}</span><span class="d" style="display:block">${esc(x.what)}${x.status==='abgesagt'?' · abgesagt':x.isNew?' · neu per Chat':''}</span></span><span class="tm">${apptPill(x)}</span></button>`).join('')).join('');
  const free=freeSlots();
  return shell(role,`<section class="dash gut">${mviews(role)}<div class="dhead"><div><h1>Termine</h1><div class="meta">${role==='mfa'?'Alle Termine der nächsten Tage – Buchungen aus dem Chat erscheinen sofort.':'Nur Ansicht – Termine plant der Empfang.'}</div></div>
   <div class="kpis"><span class="kpi">Termine <b>${S.appts.filter(x=>x.status==='ok').length}</b></span><span class="kpi">Freie Zeiten <b>${free.length}</b></span></div></div>
   <div class="grid two"><div class="panel"><h2>Tagesplan</h2><div class="list" role="listbox" aria-label="Termine">${list||'<div class="empty">Keine Termine.</div>'}</div></div>
    <div class="panel">${a?apptDetail(role,a,free):'<div class="empty big-empty">Kein Termin ausgewählt.</div>'}</div></div></section>`)}
function apptDetail(role,a,free){
  let acts='';
  if(role==='mfa'&&a.status==='ok'){
    if(ui.tmode==='versch')acts=`<div><label>Neue Zeit wählen</label><div class="slotgrid">${free.map(([d,t])=>`<button class="btn ghost sm" data-ta="mv:${d}|${t}">${d} · ${t}</button>`).join('')||'<span class="muted">Keine freien Zeiten.</span>'}</div></div><div class="acts"><button class="btn ghost" data-ta="close">Abbrechen</button></div>`;
    else if(ui.tmode==='absage')acts=confirmBox(`Termin von ${a.who} am ${a.day}, ${a.time} Uhr absagen?`,['ta-cancel','Ja, absagen']).replace('data-a="ta-cancel"','data-ta="cancel"').replace('data-a="cancelConfirm"','data-ta="close"');
    else acts=`<div class="acts"><button class="btn" data-ta="versch">Verschieben</button><button class="btn no" data-ta="absage">Absagen</button></div>`;
  } else if(role==='arzt'){acts='<div style="font-size:13px;color:var(--ink-2)">Nur Ansicht – Verschieben und Absagen macht der Empfang.</div>'}
  return `<div class="detail"><div><span class="type">Termin</span>${apptPill(a)}</div><h3>${esc(a.who)}</h3>
   <dl><dt>Wann</dt><dd>${a.day} · ${a.time} Uhr</dd><dt>Anlass</dt><dd>${esc(a.what)}</dd>${a.doc?`<dt>Bei</dt><dd>${esc(a.doc)}</dd>`:''}<dt>Quelle</dt><dd>${apptSrc(a)}</dd>${a.cancelled?`<dt>Abgesagt</dt><dd>${esc(a.cancelled)} Uhr</dd>`:''}</dl>
   ${a.mine&&a.status==='ok'?'<div style="font-size:13px;color:var(--ink-2)">Änderungen sieht die Patient:in sofort im Chat.</div>':''}
   ${acts}<div class="acts"><button class="btn ghost" data-to-pat="${esc(a.who)}">Patientenkarte öffnen</button></div></div>`}
function termAct(role,k){
  const a=S.appts.find(x=>x.id===sel.appt);if(!a)return;const t=nowLabel();
  if(k==='versch'||k==='absage'){ui={tmode:k};return render()}
  if(k==='close'){ui={};return render()}
  if(k==='cancel'){a.status='abgesagt';a.cancelled=t;
    if(a.mine){newReq({type:'Termin',text:`Termin von der Praxis abgesagt: ${a.day}, ${a.time} Uhr · ${a.what}`,status:'termin',hist:[t+' Empfang: Termin abgesagt']});
      notifyPatient({mine:true},`Ihr Termin am ${a.day} um ${a.time} Uhr (${a.what}) musste leider abgesagt werden. Bitte vereinbaren Sie einen neuen Termin – das geht direkt hier im Chat.`,[{k:'termin_neu',l:'Neuen Termin vereinbaren'}])}
    toast(a.mine?'Abgesagt – die Patient:in wurde im Chat informiert.':'Termin abgesagt.');ui={};save();return render()}
  if(k.startsWith('mv:')){const[d,tm]=k.slice(3).split('|');const old=`${a.day}, ${a.time}`;a.day=d;a.time=tm;a.isNew=false;a.moved=true;
    if(a.mine){newReq({type:'Termin',text:`Termin von der Praxis verschoben: ${old} → ${d}, ${tm} Uhr · ${a.what}`,status:'termin',hist:[t+' Empfang: Termin verschoben']});
      notifyPatient({mine:true},`Ihr Termin wurde verschoben: neu am ${d} um ${tm} Uhr (${a.what}). Passt das nicht? Sie können ihn hier im Chat ändern.`,[{k:'meine',l:'Meine Termine ansehen'}])}
    toast(a.mine?'Verschoben – die Patient:in wurde im Chat informiert.':'Termin verschoben.');ui={};save();return render()}
}
function patients(){const m=new Map();const add=(who,o)=>{if(!who||who==='Anonym')return;const p=m.get(who)||{who,born:'',phone:''};if(o.born&&!p.born)p.born=o.born;if(o.phone&&!p.phone)p.phone=o.phone;m.set(who,p)};
  add(S.profile.name,{born:S.profile.born,phone:S.profile.phone});S.reqs.forEach(r=>add(r.who,r));S.appts.forEach(a=>add(a.who,a));
  return [...m.values()].sort((a,b)=>a.who===S.profile.name?-1:b.who===S.profile.name?1:a.who.localeCompare(b.who))}

  if(!sel.arzt||!S.reqs.find(r=>r.id===sel.arzt&&(r.status==='freigabe'||r.decision)))sel.arzt=(L.wait[0]||{}).id||null;
  const r=S.reqs.find(x=>x.id===sel.arzt);
  return shell('arzt',`<section class="dash gut">${mviews('arzt')}${greet('arzt')}<div class="dhead"><div><h1>Zur Entscheidung</h1><div class="meta">Dr. A. Smirnova · nur Anfragen, die eine ärztliche Entscheidung brauchen</div></div>
   <div class="kpis"><span class="kpi">Warten <b>${L.wait.length}</b></span><span class="kpi">Heute entschieden <b>${L.done.length}</b></span></div></div>
   <div class="grid">
    <div class="panel"><h2>Wartet auf Entscheidung <span class="n">${L.wait.length}</span></h2>${listHtml(L.wait,'arzt','Alle Anfragen entschieden ✓')}
      ${L.done.length?'<h2 style="border-top:1px solid var(--line)">Entschieden <span class="n">'+L.done.length+'</span></h2>'+listHtml(L.done,'arzt'):''}</div>
    <div class="panel">${r?detailArzt(r):'<div class="empty big-empty">Alle Anfragen entschieden ✓<br><span>Neue Rezepte und Überweisungen erscheinen hier automatisch.</span></div>'}</div>
    <div class="side" style="min-width:0">${alertsHtml()}</div>
   </div></section>`)}
const TERMIN_MSG='Die Ärztin möchte das gern persönlich mit Ihnen besprechen. Bitte vereinbaren Sie einen Termin – das geht direkt hier im Chat.';
function detailArzt(r){
  if(r.decision){const d=r.decision;return `<div class="detail">${head(r)}
    <div class="decision"><label>Entscheidung</label><dl><dt>Ergebnis</dt><dd><b>${esc(d.what)}</b></dd><dt>Zeit</dt><dd>${esc(d.time)} Uhr · Dr. A. Smirnova</dd><dt>An Patient:in</dt><dd>${esc(d.msg||'—')}</dd><dt>Interne Notiz</dt><dd>${esc(d.note||'—')}</dd></dl></div>${histHtml(r)}</div>`}
  const m=ui.amode&&ui.id===r.id?ui.amode:null;let area='';
  if(m==='ask'&&!ui.preview)area=`<div><label for="askArea">Ihre Frage an ${esc(r.who)} (Pflichtfeld)</label><textarea id="askArea" placeholder="z. B. Nehmen Sie das Medikament noch täglich? Gab es Nebenwirkungen?">${esc(ui.text||'')}</textarea></div><div class="acts"><button class="btn" data-a="askPreview">Vorschau</button><button class="btn ghost" data-a="modeClose">Abbrechen</button></div>`;
  if(m==='ask'&&ui.preview)area=`<div class="preview"><label>So sieht die Patient:in Ihre Nachricht</label><div class="msg team inprev"><span class="lbl">Praxisteam</span>Rückfrage zu Ihrer Anfrage (${esc(r.type)}): ${esc(ui.text)}</div></div><div class="acts"><button class="btn" data-a="askSend">Rückfrage senden</button><button class="btn ghost" data-a="askEdit">Bearbeiten</button></div>`;
  if(m==='termin')area=`<div class="preview"><label>So sieht die Patient:in Ihre Nachricht</label><div class="msg team inprev"><span class="lbl">Praxisteam</span>${esc(TERMIN_MSG)}${ui.text?' '+esc(ui.text):''}</div></div><div><label for="tmArea">Zusatz (optional)</label><textarea id="tmArea" placeholder="z. B. Bitte nüchtern zur Blutabnahme kommen.">${esc(ui.text||'')}</textarea></div><div class="acts"><button class="btn" data-a="terminSend">Nachricht senden</button><button class="btn ghost" data-a="modeClose">Abbrechen</button></div>`;
  return `<div class="detail">${head(r)}${r.auto?'<div style="font-size:13px;color:var(--ink-2)">Direkt vom Chat: Dauermedikation, der Empfang musste nichts tun.</div>':''}
  <div><label for="noteArea">Interne Notiz an den Empfang (optional, die Patient:in sieht sie nicht)</label><textarea id="noteArea" placeholder="z. B. Bitte Kontrolltermin in 4 Wochen vereinbaren.">${esc(ui.note||'')}</textarea></div>
  ${m?area:`<div class="acts"><button class="btn ok" data-a="approve">${r.type==='Rezept'?'Unterschreiben & freigeben':'Freigeben'}</button><button class="btn ghost" data-a="askMode">Rückfrage stellen</button><button class="btn no" data-a="terminMode">Termin erforderlich</button></div>`}
  ${histHtml(r)}</div>`}
function bindDash(role){
  const app=$('#app');
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sel.mfa=null;ui={};render()});
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{sel[role]=b.dataset.sel;ui={};render()});
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(role,b.dataset.a));
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{views[role]=b.dataset.view;ui={};render();window.scrollTo(0,0)});
  app.querySelectorAll('[data-appt]').forEach(b=>b.onclick=()=>{sel.appt=b.dataset.appt;ui={};render()});
  app.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{sel.pat=b.dataset.pat;ui={};render()});
  app.querySelectorAll('[data-ta]').forEach(b=>b.onclick=()=>termAct(role,b.dataset.ta));
  app.querySelectorAll('[data-to-pat]').forEach(b=>b.onclick=()=>{sel.pat=b.dataset.toPat;views[role]='patienten';ui={};render();window.scrollTo(0,0)});
  app.querySelectorAll('[data-open-req]').forEach(b=>b.onclick=()=>openReq(role,b.dataset.openReq));
  app.querySelectorAll('[data-set]').forEach(el=>{const h=()=>{ui.set[el.dataset.set]=el.type==='checkbox'?el.checked:el.value};el.onchange=h;el.oninput=h});
  app.querySelectorAll('[data-type]').forEach(el=>el.onchange=()=>{ui.set.types[el.dataset.type]=el.checked});
  app.querySelectorAll('[data-bk]').forEach(el=>el.onchange=()=>{ui.set.booking=el.dataset.bk});
  app.querySelectorAll('[data-a2]').forEach(b=>b.onclick=()=>{if(b.dataset.a2==='save'){ui.set.rev=(S.settings.rev||0)+1;S.settings=ui.set;save();toast('Gespeichert – gilt ab sofort im Patienten-Chat.')}else toast('Änderungen verworfen.');ui={};render()});
  const keep=(id,key)=>{const el=$('#'+id);if(el)el.oninput=()=>{ui[key]=el.value;ui.id=ui.id||sel[role]}};
  keep('msgArea','text');keep('askArea','text');keep('tmArea','text');keep('noteArea','note');
}
function advance(role,listBefore,id){
  const i=listBefore.indexOf(id);const rest=listBefore.filter(x=>x!==id);
  const stillThere=role==='mfa'?mfaLists()[tab].map(r=>r.id):arztLists().wait.map(r=>r.id);
  if(stillThere.includes(id))return;
  const nxt=rest.filter(x=>stillThere.includes(x));sel[role]=nxt[Math.min(i,nxt.length-1)]||null;
}
function doAct(role,a){
  const r=S.reqs.find(x=>x.id===sel[role]);if(!r)return;
  const before=role==='mfa'?mfaLists()[tab].map(x=>x.id):arztLists().wait.map(x=>x.id);
  const el=$('#msgArea');const msg=((el&&el.value)||'').trim();const t=nowLabel();
  const keepUi=()=>{ui.id=r.id};
  switch(a){
    case 'cancelConfirm': ui={};return render();
    case 'doneAsk': ui={confirm:r.id,id:r.id,text:el?el.value:ui.text};return render();
    case 'askOpen': ui={ask:r.id,id:r.id};return render();
    case 'toArzt': if(r.decision){(r.prev=r.prev||[]).push(r.decision);delete r.decision}r.status='freigabe';r.back=false;r.hist.push(t+' MFA: an Ärztin weitergeleitet');toast('An die Ärztin weitergeleitet – nächste Anfrage geöffnet.');break;
    case 'ask': if(!msg){toast('Bitte zuerst die Rückfrage schreiben.');return}
      r.status='wartet';r.question=msg;r.askedAt=t;r.patientReply=null;r.back=false;r.hist.push(t+' MFA: Rückfrage gesendet – wartet auf Antwort');notifyPatient(r,`Rückfrage zu Ihrer Anfrage (${r.type}): ${msg}`,[{k:'reply:'+r.id,l:'Auf die Rückfrage antworten'}]);toast('Rückfrage gesendet – die Anfrage liegt jetzt unter „Wartet auf Antwort“.');break;
    case 'answer': if(!msg){toast('Bitte zuerst eine Antwort schreiben.');return}r.status='beantwortet';r.answer=msg;r.back=false;r.hist.push(t+' MFA: beantwortet');notifyPatient(r,msg);toast('Antwort gesendet – erscheint im Chat der Patient:in.');break;
    case 'done': r.status='erledigt';r.back=false;r.hist.push(t+' MFA: ohne Antwort abgeschlossen');toast('Abgeschlossen. Unter „Erledigt“ können Sie die Anfrage wieder öffnen.');break;
    case 'reopen': r.status='neu';r.hist.push(t+' MFA: wieder geöffnet');tab='offen';sel.mfa=r.id;ui={};toast('Wieder geöffnet – liegt unter „Zu bearbeiten“.');save();return render();
    case 'pickup': r.picked=true;r.status='erledigt';r.hist.push(t+' MFA: abgeholt');toast('Als abgeholt markiert.');break;
    case 'callOk': r.status='erledigt';r.hist.push(t+' MFA: Patient:in erreicht – Rückruf erledigt');toast('Rückruf erledigt.');break;
    case 'callFail': r.tries=(r.tries||0)+1;r.next=null;r.hist.push(`${t} MFA: nicht erreicht (Versuch ${r.tries})`);keepUi();toast('Versuch notiert. Der Rückruf bleibt offen.');save();return render();
    case 'callRetry': r.next=laterLabel(1);r.hist.push(`${t} MFA: neuer Versuch geplant um ${r.next} Uhr`);keepUi();toast('Neuer Versuch eingeplant.');save();return render();
    case 'callMsg': if(!msg){toast('Bitte zuerst eine Nachricht schreiben.');return}r.hist.push(t+' MFA: Nachricht gesendet – Rückruf noch offen');notifyPatient(r,msg);ui={id:r.id};toast('Nachricht gesendet. Der Rückruf ist noch nicht erledigt.');save();return render();
    case 'askMode': ui={amode:'ask',id:r.id,note:ui.note};return render();
    case 'terminMode': ui={amode:'termin',id:r.id,note:ui.note};return render();
    case 'modeClose': ui={note:ui.note,id:r.id};return render();
    case 'askPreview':{const v=(($('#askArea')||{}).value||'').trim();if(!v){toast('Bitte zuerst Ihre Frage schreiben.');return}ui.text=v;ui.preview=true;return render()}
    case 'askEdit': ui.preview=false;return render();
    case 'askSend':{const q=ui.text;const note=(($('#noteArea')||{}).value||ui.note||'').trim();const pm=`Rückfrage zu Ihrer Anfrage (${r.type}): ${q}`;
      r.status='wartet';r.question=q;r.askedAt=t;r.patientReply=null;r.decision={what:'Rückfrage gestellt',time:t,msg:pm,note};r.hist.push(t+' Ärztin: Rückfrage gestellt – wartet auf Antwort');
      notifyPatient(r,pm,[{k:'reply:'+r.id,l:'Auf die Rückfrage antworten'}]);toast('Rückfrage gesendet.');ui={};break}
    case 'terminSend':{const add=(($('#tmArea')||{}).value||'').trim();const note=(($('#noteArea')||{}).value||ui.note||'').trim();const pm=TERMIN_MSG+(add?' '+add:'');
      r.status='termin_noetig';r.answer=pm;r.decision={what:'Termin erforderlich',time:t,msg:pm,note};r.hist.push(t+' Ärztin: Termin erforderlich');
      notifyPatient(r,pm,[{k:'termin_neu',l:'Termin vereinbaren'}]);toast('Nachricht gesendet – die Patient:in kann direkt einen Termin buchen.');ui={};break}
    case 'approve':{const note=(($('#noteArea')||{}).value||ui.note||'').trim();
      const pm=r.type==='Rezept'?(r.detail==='Abholung am Empfang'?`Ihr Rezept für ${r.text} ist fertig und liegt am Empfang bereit.`:`Ihr E-Rezept für ${r.text} ist freigegeben. Sie können es mit Ihrer Gesundheitskarte in jeder Apotheke einlösen.`):`Ihre Überweisung (${r.text.split(':')[0]}) ist freigegeben. Sie können sie am Empfang abholen.`;
      r.status='freigegeben';r.answer=pm;r.decision={what:r.type==='Rezept'?'Unterschrieben & freigegeben':'Freigegeben',time:t,msg:pm,note};r.hist.push(t+' Ärztin: freigegeben'+(note?' – Notiz: '+note:''));
      notifyPatient(r,pm);toast('Freigegeben – nächste Anfrage geöffnet.');ui={};break}
  }
  if(!['callFail','callRetry','callMsg'].includes(a)){ui={};advance(role,before,r.id)}
  save();render();
}
render();
if(freshStart)toast('Neuer Testdurchlauf – Beispieldaten geladen.');
})();
</script>
