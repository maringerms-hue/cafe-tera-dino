<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Tera – Dino Spiel</title>
<style>
:root{color-scheme:only light}
:root{--ink:#4a3628;--latte:#fff4ec;--circle:#efdcc6}
html,body{margin:0;height:100%;background:var(--latte);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;display:block}
.bg .circle{width:min(84vmin,720px);aspect-ratio:1;border-radius:50%;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--circle)}
.bg .b1{width:62vmin;height:46vmin;left:-14vmin;top:-12vmin;background:#d3e4ad;border-radius:58% 42% 63% 37%/48% 55% 45% 52%}
.bg .b2{width:58vmin;height:50vmin;right:-16vmin;bottom:-10vmin;background:#f7cbc6;border-radius:42% 58% 38% 62%/57% 43% 57% 43%;opacity:.85}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
.ui{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:2;max-width:92vw}
.free{position:fixed;left:50%;top:auto;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,0);z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .3s,transform .3s;pointer-events:none}
.free.mid{bottom:auto;transform:translate(-50%,-50%)}

.free .steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:nowrap}
.free .steps li{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:rgba(255,250,243,.82);box-shadow:0 4px 14px rgba(90,60,30,.08);font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#4a3628;white-space:nowrap}
.free .steps i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#4a3628;color:#fffaf3;font-size:11px;font-weight:800}
.free.short .steps{display:none}
@media (max-width:380px){.free .steps li{font-size:11px;padding:5px 8px 5px 5px}.free .steps{gap:4px}}
.free .tag{margin:0;width:max-content;max-width:min(88vw,520px);text-align:center;font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:rgba(74,54,40,.72);transition:opacity .25s,transform .25s;text-wrap:balance}
.free .tag b{display:block;white-space:nowrap;font-weight:800;font-size:17px;letter-spacing:-.01em;color:#4a3628;margin-bottom:3px}
.free .tag span{display:block}
.top{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:2}
button{appearance:none;border:0;border-radius:999px;padding:11px 16px;font:600 14px/1 inherit;background:#fffaf3;color:#3a2a20;cursor:pointer;box-shadow:0 6px 18px rgba(90,60,30,.16)}
button.ghost{background:transparent;outline:1.5px solid rgba(74,54,40,.35)}
button:active{transform:scale(.97)}
.t1{background:#f3a5b1}.t2{background:#ffcf69}.t3{background:#abb1e7}
.toast{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:3;background:#fffaf3;color:#3a2a20;padding:12px 20px;border-radius:999px;font:700 17px/1.2 inherit;box-shadow:0 8px 24px rgba(90,60,30,.18);opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.info{position:fixed;left:16px;top:16px;font-size:12px;opacity:.7;z-index:2}

.info{display:none}
/* --- collection badges --- */
.badges{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:2;padding:8px 16px 8px 8px;background:rgba(255,250,243,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;box-shadow:0 8px 22px rgba(90,60,30,.10)}
.badge{appearance:none;border:0;background:none;box-shadow:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;width:auto;padding:0;cursor:default;color:inherit}
.badge .lbl{display:none!important}
.badge .disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#ece2d4;box-shadow:inset 0 0 0 2px rgba(74,54,40,.07);transition:transform .25s}

.badge .lbl{font:650 11px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:rgba(74,54,40,.42);white-space:nowrap}
.badge.got{cursor:pointer}.badge.got .disc{background:var(--soft)}.badge.got .disc svg{filter:none;opacity:1}.badge.got .lbl{color:var(--ink)}
.badge.got:hover .disc{transform:translateY(-2px) rotate(-4deg)}
.badge:focus-visible{outline:none}.badge:focus-visible .disc{outline:2px solid var(--ink);outline-offset:2px}
.badge.new .disc{animation:pop .8s cubic-bezier(.3,1.6,.5,1)}

.count{font:800 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding-left:4px;font-variant-numeric:tabular-nums}

.bubble[data-side=l]::after{left:auto;right:-7px}
.bubble.think::after{width:12px;height:12px;border-radius:50%;left:-14px;bottom:4px;transform:none;box-shadow:0 4px 10px rgba(90,60,30,.12)}
.bubble.think::before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:inherit;left:-24px;bottom:-4px;box-shadow:0 3px 8px rgba(90,60,30,.12)}
.bubble.think[data-side=l]::after{left:auto;right:-14px}.bubble.think[data-side=l]::before{left:auto;right:-24px}

.leaf{position:fixed;left:0;top:0;z-index:3;pointer-events:none;will-change:transform,opacity}
.leaf svg{display:block;width:100%;height:100%}

.card{position:fixed;z-index:4;right:max(24px,4vw);top:50%;width:min(340px,calc(100vw - 32px));box-sizing:border-box;padding:18px 18px 20px;background:#fffaf3;border-radius:28px;color:var(--ink);box-shadow:0 22px 56px rgba(90,60,30,.24);opacity:0;transform:translate(36px,-50%);pointer-events:none;transition:opacity .35s,transform .5s cubic-bezier(.2,.9,.3,1)}

.card .x{position:absolute;right:12px;top:12px;width:34px;height:34px;padding:0;border-radius:50%;font:600 18px/1 system-ui,sans-serif;background:rgba(255,250,243,.9);box-shadow:none;z-index:1}
.cupwrap{height:178px;border-radius:22px;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:8px;box-sizing:border-box;background:radial-gradient(circle at 50% 62%,var(--soft) 0 56%,transparent 57%),#f5ece0}

.cupwrap.many svg{height:112px}

.cupwrap.many img{height:118px}
.ticket[hidden],.fine[hidden]{display:none!important}
.kicker{margin:16px 0 6px;font:750 11px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
.card h2{margin:0 0 8px;font:800 27px/1.08 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
.card h2 em{font-style:normal;color:var(--accent)}
.card .t{margin:0 0 16px;font:500 15px/1.45 system-ui,sans-serif;opacity:.78}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;padding:12px 18px;font:700 14px/1 system-ui,sans-serif;cursor:pointer}
.btn.primary{background:#4a3628;color:#fffaf3;box-shadow:0 8px 18px rgba(74,54,40,.25)}
.btn.primary:hover{background:#3a2a1f}
.btn.ghost{background:transparent;color:#4a3628;box-shadow:none;outline:1.5px solid rgba(74,54,40,.3)}

.ui button.main{background:#4a3628;color:#fffaf3;padding:14px 24px;font-size:15px;transition:opacity .25s,transform .25s}
.ui button.main.hide{opacity:0;transform:translateY(12px);pointer-events:none}
.dev{position:fixed;left:12px;bottom:12px;z-index:2;font:600 12px/1 system-ui,sans-serif}
.dev summary{cursor:pointer;opacity:.45;list-style:none;padding:6px 8px}
.dev div{display:flex;flex-wrap:wrap;gap:6px;max-width:280px;margin-top:6px}
.dev button{padding:7px 10px;font-size:12px}
@media (max-width:700px){
  .badges{gap:8px;padding:7px 14px 7px 7px}.badge{width:auto;padding:0}.badge .disc{width:38px;height:38px}.badge .disc svg{width:24px;height:24px}.badge .lbl{font-size:9px}
  .bubble{font-size:14px;padding:11px 14px}
  .card{left:16px;right:16px;width:auto;top:auto;bottom:16px;transform:translateY(40px)}

.ticket{margin:0 0 14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--soft) 45%,#fffaf3)}

.ticket .lbl2{display:block;font:700 10px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:6px}
.fine{margin:-4px 0 14px;font:500 11.5px/1.4 system-ui,sans-serif;opacity:.55}
.card.coupon .t{margin-bottom:12px}
body.embed .dev{display:none}
body.embed .badges{left:50%}
body.nodev .dev{display:none!important}
</style>

      const p0=fruit.position.clone(), p1=new THREE.Vector3(0,0.63,0.43), t0=performance.now(), D=420, s0=fruit.scale.x;
      (function hop(){ const q=Math.min(1,(performance.now()-t0)/D);
        fruit.position.lerpVectors(p0,p1,q); fruit.position.y+=0.12*Math.sin(Math.PI*q); fruit.scale.setScalar(s0*(1-0.6*q));
        lookAt(fruit.position,300);
        if(q<1) requestAnimationFrame(hop); else fruit.visible=false; })();
    },150);
    setTimeout(()=>{ setTint(k); leafBurst(k); renderBadges(k); },700);
    setTimeout(()=>tweenY(cup,TOP,420),1300);
    setTimeout(()=>say('Mmh! Jetzt bin ich '+DINOS[k]+'!',2400),1500);
    setTimeout(()=>{ showCard(k); playBtn.textContent=found.size===ORDER.length?'↺ Neu sammeln':'▶ Nächste Runde'; },3100);
  } else {
    say('Oh nein! Hier war '+IT(k)+'.',2200);
    play('sad',0.25);
    setTimeout(()=>{ tweenY(fc,TOP+0.14,380); lookAt(fc.position.clone().setY(TOP),1600); },500);
    setTimeout(()=>{ tweenY(cup,TOP,420); tweenY(fc,TOP,420).then(()=>{ fruit.visible=false; }); },2300);
    setTimeout(()=>{ say('Nochmal? Ich verstecke '+IT(k)+' neu!',0); setPlay('▶ Nochmal'); },2700);
  }
}
document.getElementById('cheat').onclick=()=>{ if(gameState==='choose') choose(fruitCup); };
// start screen
renderBadges();
setPlay(found.size===ORDER.length?'↺ Neu sammeln':found.size?'▶ Weiter sammeln':'▶ Spielen');
setTimeout(()=>{ play('wave',0.3); say(PROMO&&found.size<ORDER.length?'Sammle alle 4 Dinos und hol dir '+PROMO.off+' auf den '+PROMO.drink+'! '+PROMO.label.split(' ').pop():(found.size?'Schön, dass du wieder da bist!':'Hallo! Findest du meine Früchte?'),4200); },700);
// picking
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downXY=null;
canvas.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!downXY) return; const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]); downXY=null; if(moved>6) return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,cam);
  const hits=ray.intersectObjects(cups,true); if(!hits.length) return;
  let o=hits[0].object; while(o && !cups.includes(o)) o=o.parent; if(o) choose(cups.indexOf(o));
});
canvas.addEventListener('pointermove',e=>{
  if(gameState!=='choose'){ canvas.style.cursor=''; return; }
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,cam);
  const h=ray.intersectObjects(cups,true); canvas.style.cursor=h.length?'pointer':'';
  cups.forEach(c=>{ const on=h.length && (h[0].object===c || c.getObjectById(h[0].object.id)); c.userData.hover=on?1:0; });
});
document.querySelector('[data-g=play]').onclick=()=>startGame();

// --- loop ---
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=cam.aspect>=1.2?30:Math.min(58,Math.max(29,2*Math.atan(0.19/cam.aspect)*180/Math.PI));cam.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
// place slogan + steps in the free space between table and play button
const _tb=new THREE.Box3().setFromObject(gT.scene), _tv=new THREE.Vector3();
function placeFree(){ const fb=document.getElementById('freebox'), pb=document.querySelector('[data-g=play]'); if(!fb||!pb) return;
  cam.updateMatrixWorld(); let yMax=-1e9;
  for(let i=0;i<8;i++){ _tv.set(i&1?_tb.max.x:_tb.min.x, i&2?_tb.max.y:_tb.min.y, i&4?_tb.max.z:_tb.min.z).project(cam); yMax=Math.max(yMax,(1-_tv.y)/2*innerHeight); }
  const btnTop=innerHeight-22-pb.offsetHeight; fb.classList.remove('short','mid'); fb.style.top='';
  const h=fb.offsetHeight, room=btnTop-yMax;
  if(room>h+40){ fb.classList.add('mid'); fb.style.top=Math.round(yMax+room/2)+'px'; }
  else { fb.classList.add('short'); } }
addEventListener('resize',()=>setTimeout(placeFree,30)); setTimeout(placeFree,50);
const clock=new THREE.Clock(), tmp=new THREE.Vector3();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05); mixer.update(dt);
  if(liftActive && anchor){ anchor.getWorldPosition(tmp); const c=cups[fruitCup]; c.position.copy(tmp); }
  dino.updateMatrixWorld(true); updateEyes(dt);
  const k=1-Math.exp(-dt*3.2); tintU.uTint.value.lerp(tintT.col,k); tintU.uAmt.value+=(tintT.amt-tintU.uAmt.value)*k;
  lidMats.forEach((m,i)=>{const b=lidBase[i],l=0.2126*b.r+0.7152*b.g+0.0722*b.b; m.color.copy(b).lerp(tintU.uTint.value.clone().multiplyScalar(l/0.263),tintU.uAmt.value);});
  if(gameState==='choose') cups.forEach(c=>{ const t=TOP+(c.userData.hover?0.015:0); c.position.y+=(t-c.position.y)*Math.min(1,dt*12); });
  controls.update(); renderer.render(scene,cam); updateBubble();
});
</script></body></html>
